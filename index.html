<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>코어 블레이드 — 3D 아레나</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game"></div><div class="grain"></div>
  <header class="topbar">
    <div class="brand"><span class="sigil">核</span><div><b>CORE BLADE</b><small>PROTOTYPE · 01</small></div></div>
    <div class="wave"><small>WAVE</small><strong id="wave">01</strong></div>
    <div class="score"><small>DEFEATED</small><strong id="score">00</strong></div>
  </header>
  <section class="health-panel"><div class="health-label"><span>CORE INTEGRITY</span><strong id="healthText">100</strong></div><div class="health-track"><i id="healthBar"></i></div></section>
  <div class="crosshair"><i></i><i></i></div>
  <div id="combo" class="combo"><strong>2</strong><span>SLASH</span></div>
  <div id="waveBanner" class="wave-banner"><small>적 출현</small><strong>WAVE 1</strong></div>
  <button id="changeCharacter" class="change-character">캐릭터 <kbd>C</kbd></button>
  <footer class="controls">
    <div><kbd>WASD</kbd><span>이동</span></div><div><kbd>SHIFT</kbd><span>질주</span></div>
    <div class="attack"><kbd>SPACE</kbd><span>양날 베기</span></div><div><kbd>R</kbd><span>재시작</span></div>
  </footer>
  <div id="gameOver" class="game-over"><small>CORE SIGNAL LOST</small><h1>전투 불능</h1><p><b id="finalScore">0</b>기의 적을 베었습니다</p><button id="restart">다시 시작 <kbd>R</kbd></button></div>
  <section id="characterMenu" class="character-menu show">
    <div class="menu-heading"><small>SELECT UNIT</small><h1>전투 유닛 선택</h1><p>사진을 바탕으로 제작된 두 캐릭터 중 하나를 선택하세요</p></div>
    <div class="character-cards">
      <button class="character-card selected" data-unit="core"><span class="unit-no">UNIT 01</span><div class="unit-art core-art"><i></i><b></b></div><h2>코어 블레이드</h2><p>분홍 코어 · 쌍검 · 넓은 베기</p><em>균형형</em></button>
      <button class="character-card" data-unit="sentinel"><span class="unit-no">UNIT 02</span><div class="unit-art sentinel-art"><i></i><b></b></div><h2>아카이브 센티널</h2><p>다중 총열 · 장검 · 원거리 사격</p><em>사격형</em></button>
    </div>
    <button id="startGame" class="start-game">이 유닛으로 출격</button>
  </section>
  <div id="loading" class="loading"><span></span><p>전투장을 조립하는 중</p></div>
  <script src="vendor/three.min.js"></script><script src="game.js"></script>
</body>
</html>
